<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Control room: a grid operator's screen. Dark in both colour schemes; amber for power and the featured country, blue and red for the US and China stacks. */
:root{
  --bg:#0b0f14; --surface:#121a23; --fg:#dbe4ee; --muted:#8a9bad; --line:#243243;
  --accent:#f2a93b; --accent-soft:#33260f; --us:#4fa3ff; --cn:#ff6b6b; --other:#6f7f8f; --unk:#3b4756;
  --t1:#3cc49a; --t2:#d9a441; --t3:#ff6b6b; --t0:#1d2733; --coal:#8a96a3; --gas:#f2a93b; --hydro:#4fa3ff; --solar:#f5d547; --oth:#5c6b7a;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1040px;margin:0 auto}
.read{max-width:66ch}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
section{padding-block:56px;border-top:1px solid var(--line);display:grid;gap:20px}
header.hero{padding-block:56px 40px;display:grid;gap:22px}
.banner{font-family:var(--mono);font-size:.78rem;background:var(--accent-soft);color:var(--fg);padding:8px 12px;border-radius:6px;justify-self:start}
.lede{font-size:1.18rem}
.sub{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px}
.kpi b{font-family:var(--display);font-size:2rem;font-stretch:80%;font-weight:800}
.kpi span{font-size:.86rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.86rem;padding:6px 12px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{font-size:.84rem;color:var(--muted)}
.drivers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.driver{border-top:3px solid var(--accent);padding-top:10px;display:grid;gap:6px;align-content:start}
.driver p{font-size:.94rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);border-left-width:4px;background:var(--surface);color:var(--fg);border-radius:6px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.tl{position:relative;display:grid;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:10px 0}
.ev::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--other));border:2px solid var(--bg)}
.ev.key::before{width:16px;height:16px;left:-23px;top:14px;box-shadow:0 0 0 3px var(--accent-soft)}
.ev .d{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:3px}
.ev h3{font-family:var(--body);font-size:1rem;font-weight:600}
.ev p{font-size:.92rem;color:var(--muted)}
.ev .why{color:var(--fg);font-size:.88rem}
.ev .src{font-size:.78rem}
.tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-left:8px;white-space:nowrap}
.amt{font-family:var(--mono);font-size:.78rem;background:var(--accent-soft);padding:1px 6px;border-radius:4px;margin-left:8px;white-space:nowrap}
@media (max-width:560px){.ev{grid-template-columns:1fr;gap:2px}}
.mapgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.mapgrid{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block}
.land{fill:var(--line);stroke:var(--muted);stroke-width:.6}
.land.my{fill:var(--accent-soft)}
.site{cursor:pointer;stroke-width:1.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;min-width:0;align-content:start}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.88rem}
.card dt{color:var(--muted)}
.card dd{margin:0;overflow-wrap:anywhere}
.stackbar{display:flex;height:34px;border-radius:6px;overflow:hidden}
.stackbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:.8rem;min-width:28px}
.funnel{display:grid;gap:10px}
.fbar{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center}
.fbar .track{height:34px}
.fbar .fill{height:100%;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-family:var(--mono);font-size:.85rem;min-width:72px}
.fbar.water .fill{background:var(--us)}
.fbar .lab{font-size:.9rem}
@media (max-width:560px){.fbar{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.risk{display:grid;gap:6px;border-left:3px solid var(--cn);padding-left:12px;align-content:start}
.risk.lev{border-left-color:var(--us)}
.risk ul{margin:0;padding-left:18px;color:var(--muted);font-size:.94rem;display:grid;gap:4px}
.undisc{font-size:.85rem;color:var(--muted)}
.sources{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
.sources a{overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
button.driver{font:inherit;text-align:left;background:transparent;border:0;border-top:3px solid var(--line);color:var(--fg);cursor:pointer;padding:10px 0 0}
button.driver[aria-expanded="true"]{border-top-color:var(--accent)}
button.driver .more{font-family:var(--mono);font-size:.74rem;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.panel[hidden]{display:none}
.panel svg{width:100%;height:auto;display:block}
.world svg{width:100%;height:auto;display:block}
.world path{stroke:var(--bg);stroke-width:.5}
.world path.my{stroke:var(--fg);stroke-width:1.6}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;background:var(--surface)}
.box b{font-family:var(--display);font-size:1.6rem;font-stretch:80%}
.box span{font-size:.84rem;color:var(--muted)}
.callout{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:grid;gap:6px;align-content:start}
table.sc{border-collapse:collapse;font-size:.88rem;width:100%;min-width:520px}
table.sc th,table.sc td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.sc td:first-child{font-family:var(--body)}

/* control-room layer */
body{background-color:var(--bg);background-image:linear-gradient(rgba(36,50,67,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(36,50,67,.45) 1px,transparent 1px);background-size:48px 48px}
h1{text-transform:uppercase;letter-spacing:.02em;font-weight:700}
h2{font-weight:600;letter-spacing:.01em}
.kpi b,.box b{font-stretch:normal;color:var(--accent);font-family:var(--display);font-weight:600}
.kpi,.figure,.box,.card,.panel,.seg,.chip,.banner{border-radius:2px}
.banner{background:var(--accent);color:#0b0f14}
.eyebrow{color:var(--accent)}
svg text{font-family:var(--mono)!important}
.land{fill:#1a2430;stroke:#3b4b5e}.land.my{fill:#2a2215;stroke:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#0b0f14}
.fbar .fill{color:#0b0f14}

/* site nav */
.nav{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.nav a{color:var(--muted);text-decoration:none}.nav a[aria-current="page"]{color:var(--accent)}.nav a:hover{color:var(--fg)}
.nav .brand{color:var(--fg);margin-right:auto}
</style>

<div class="wrap">
__NAV__
__BODY__
</div>

<script>
const M=__MARKET__, GEO=__GEO__, CO=__COUNTRIES__, EV=__EVENTS__, SI=__SITES__, WORLD=__WORLD__, TIERS=__TIERS__, SPEED=__SPEED__, CAP=__CAP__, MIX=__MIX__;
const NS="http://www.w3.org/2000/svg";
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bindSeg(a,b,f,after){const A=document.getElementById(a),B=document.getElementById(b);
  A.onclick=()=>{A.setAttribute("aria-pressed","true");B.setAttribute("aria-pressed","false");f(true);after()};
  B.onclick=()=>{B.setAttribute("aria-pressed","true");A.setAttribute("aria-pressed","false");f(false);after()};}

/* 1. global chart */
const BIG=new Set(["United States","China"]);
const C=CO.map(c=>({n:c.country,o:+c.operational_gw,p:+c.pipeline_gw,cost:+c.build_cost_usd_m_per_mw||null,low:c.confidence==="low",big:BIG.has(c.country)})).map(c=>({...c,t:c.o+c.p}));
C.forEach(a=>{a.leap=!a.big&&C.some(b=>!b.big&&b.o>a.o&&a.t>b.t)});
const st={sort:"tot",usd:false,us:false};
function draw(){
  const svg=document.getElementById("gchart");svg.innerHTML="";
  let d=C.filter(x=>st.us||!x.big);
  const val=x=>st.usd?{o:x.o*(x.cost||9.5),t:x.t*(x.cost||9.5)}:{o:x.o,t:x.t};
  d=[...d].sort((a,b)=>st.sort==="op"?val(b).o-val(a).o:val(b).t-val(a).t);
  const rowH=24,left=150,right=150,W=Math.max(620,svg.parentElement.clientWidth-32),H=d.length*rowH+8;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width",W);svg.setAttribute("height",H);
  const max=Math.max(...d.map(x=>val(x).t)),sx=v=>v/max*(W-left-right);
  d.forEach((x,i)=>{
    const y=i*rowH+4,isM=x.n===M.name,v=val(x),g=el("g",{},svg);
    el("text",{x:left-8,y:y+13,"text-anchor":"end","font-size":12,fill:isM?"var(--accent)":"var(--fg)","font-weight":isM?700:400,"font-family":"Inter,system-ui,sans-serif"},g).textContent=x.n+(x.big?" ‡":x.low?" *":"");
    el("rect",{x:left,y,width:Math.max(1,sx(v.t)),height:17,rx:3,fill:isM?"var(--accent)":"var(--muted)","fill-opacity":.28},g);
    el("rect",{x:left,y,width:Math.max(1,sx(v.o)),height:17,rx:3,fill:isM?"var(--accent)":"var(--fg)"},g);
    if(x.leap&&st.sort==="tot") el("rect",{x:left-1,y:y-1,width:sx(v.t)+2,height:19,rx:4,fill:"none",stroke:"var(--accent)","stroke-width":2},g);
    const lab=st.usd?`$${Math.round(v.o)} · $${Math.round(v.t)}bn${x.cost?"":" †"}`:`${x.o.toFixed(2)} · ${x.t.toFixed(2)} GW`;
    el("text",{x:left+sx(v.t)+6,y:y+13,"font-size":11,fill:"var(--muted)","font-family":"JetBrains Mono,monospace"},g).textContent=lab;
    el("title",{},g).textContent=`${x.n}: ${x.o} GW operational, ${x.p} GW pipeline${x.cost?`, build cost about US$${x.cost}m per MW`:""}`;
  });
  document.getElementById("gnote").innerHTML=`__GNOTE__`;
}
bindSeg("sortOp","sortTot",v=>st.sort=v?"op":"tot",draw);
bindSeg("uGW","uUSD",v=>st.usd=!v,draw);
bindSeg("usOff","usOn",v=>st.us=!v,draw);
draw();addEventListener("resize",draw);

/* 2. why cards */
const T=(svg,x,y,txt,o={})=>{const t=el("text",{x,y,"font-size":o.fs||11,fill:o.fill||"var(--muted)","font-family":o.mono===false?"Inter,system-ui,sans-serif":"JetBrains Mono,monospace","text-anchor":o.a||"start","font-weight":o.w||400},svg);t.textContent=txt;return t};
function hbars(rows,{unit,fmt,colorOf,title}){
  const svg=el("svg",{role:"img","aria-label":title}),rowH=24,left=210,right=90,W=760,H=rows.length*rowH+30;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const max=Math.max(...rows.map(r=>r.hi??r.v)),sx=v=>v/max*(W-left-right);
  rows.forEach((r,i)=>{const y=i*rowH+4,me=r.n===M.name||(M.speedHighlight&&r.n.includes(M.speedHighlight));
    T(svg,left-8,y+13,r.n,{a:"end",mono:false,fill:me?"var(--accent)":"var(--fg)",w:me?700:400,fs:12});
    if(r.hi!=null&&r.lo!=null&&r.hi!==r.lo){el("rect",{x:left+sx(r.lo),y:y+2,width:Math.max(2,sx(r.hi)-sx(r.lo)),height:13,rx:3,fill:colorOf(r),"fill-opacity":.85},svg)}
    else el("rect",{x:left,y,width:Math.max(2,sx(r.hi??r.v)),height:17,rx:3,fill:colorOf(r)},svg);
    T(svg,left+sx(r.hi??r.v)+6,y+13,fmt(r));});
  el("line",{x1:left,x2:left,y1:0,y2:H-26,stroke:"var(--line)"},svg);
  T(svg,left,H-8,"0");T(svg,W-right,H-8,`${Math.round(max)} ${unit}`,{a:"end"});
  return svg}
function lines(series,periods,{unit,title}){
  const svg=el("svg",{role:"img","aria-label":title}),W=760,H=300,l=56,r=150,t=16,b=34;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const max=Math.max(...series.flatMap(s=>s.pts.map(p=>p.v)))*1.08;
  const sx=i=>l+i/(periods.length-1||1)*(W-l-r),sy=v=>t+(1-v/max)*(H-t-b);
  [0,.5,1].forEach(f=>{const v=max*f;el("line",{x1:l,x2:W-r,y1:sy(v),y2:sy(v),stroke:"var(--line)"},svg);T(svg,l-6,sy(v)+4,Math.round(v).toLocaleString(),{a:"end"})});
  periods.forEach((p,i)=>T(svg,sx(i),H-12,p,{a:"middle",fs:10}));
  series.forEach(s=>{const pts=s.pts.map(p=>[sx(periods.indexOf(p.p)),sy(p.v)]);
    el("polyline",{points:pts.map(q=>q.join(",")).join(" "),fill:"none",stroke:s.c,"stroke-width":2.5},svg);
    pts.forEach((q,i)=>{const c=el("circle",{cx:q[0],cy:q[1],r:3.5,fill:s.c},svg);el("title",{},c).textContent=`${s.name}, ${s.pts[i].p}: ${s.pts[i].v.toLocaleString()} ${unit}`});
    const last=pts[pts.length-1],off=series.length>1?(s===series[0]?-8:12):4;T(svg,last[0]+8,last[1]+off,`${s.name} ${s.pts[s.pts.length-1].v.toLocaleString()} ${unit}`,{fill:s.c,w:600});});
  return svg}
const PANELS={
  sg(){const geos=[...new Set(CAP.map(r=>r.geography))],periods=[...new Set(CAP.map(r=>r.period))];
    const col=M.capColors||{};
    const series=geos.filter(g=>col[g]||/kuala|klang|greater kl/i.test(g)).map(g=>({name:g,c:col[g]||"var(--other)",pts:CAP.filter(r=>r.geography===g&&r.operational_mw).map(r=>({p:r.period,v:+r.operational_mw}))})).filter(s=>s.pts.length);
    return [`<h3>Operating data centre capacity, MW</h3>`,lines(series,periods,{unit:"MW",title:"Operating capacity over time"}),`<p class="note">${esc([...new Set(CAP.map(r=>r.source_name))].join("; "))}. __SG_NOTE__</p>`]},
  speed(){const rows=SPEED.filter(r=>r.months_low||r.months_high).map(r=>({n:r.market,lo:+(r.months_low||r.months_high),hi:+(r.months_high||r.months_low),note:r.metric_note})).sort((a,b)=>a.hi-b.hi);
    const qual=SPEED.filter(r=>!r.months_low&&!r.months_high);
    return [`<h3>Typical wait for a large grid connection, months</h3>`,hbars(rows,{unit:"months",title:"Months to power by market",fmt:r=>r.lo===r.hi?`${r.hi}`:`${r.lo} to ${r.hi}`,colorOf:r=>(M.speedHighlight&&r.n.includes(M.speedHighlight))?"var(--accent)":"var(--other)"}),
      qual.length?`<p class="note">No comparable number: ${qual.map(r=>`${esc(r.market)} (${esc(r.metric_note)})`).join("; ")}.</p>`:"",`<p class="note">Estimates come from different studies and years, so treat the order as rough. Sources: ${esc([...new Set(SPEED.map(r=>r.source_name))].join("; "))}.</p>`]},
  cost(){const rows=C.filter(x=>x.cost).map(x=>({n:x.n,v:x.cost})).sort((a,b)=>b.v-a.v);
    return [`<h3>Cost to build a mid-spec data centre, US$ million per MW</h3>`,hbars(rows,{unit:"US$m/MW",title:"Build cost per MW by country",fmt:r=>r.v.toFixed(1),colorOf:r=>r.n===M.name?"var(--accent)":"var(--other)"}),`<p class="note">Building shell, power and cooling only, chips excluded. Asia-Pacific, US, UAE and Saudi figures are national averages; the European and Brazilian figures are for the main city. Sources: Cushman &amp; Wakefield Data Center Development Cost Guide 2026 and Turner &amp; Townsend Data Centre Cost Index.</p>`]},
  stacks(){return [`<h3>Two stacks, one host</h3>`,`<div class="stat"><div class="box"><b class="mono">~75%</b><span>US share of the world's GPU cluster performance, May 2025 (Epoch AI)</span></div><div class="box"><b class="mono">~15%</b><span>China's share, same measure</span></div><div class="box"><b class="mono">~4 GW</b><span>Overseas capacity Chinese cloud firms are set to lease by 2029, about double 2026 (SemiAnalysis)</span></div></div>`,`<p><a href="#chipaccess">See where ${M.name} sits in the US chip rules ↓</a></p>`]}
};
document.querySelectorAll("button.driver").forEach(b=>b.onclick=()=>{
  const pnl=document.getElementById("whyPanel"),open=b.getAttribute("aria-expanded")==="true";
  document.querySelectorAll("button.driver").forEach(x=>x.setAttribute("aria-expanded","false"));
  if(open){pnl.hidden=true;return}
  b.setAttribute("aria-expanded","true");pnl.hidden=false;pnl.innerHTML="";
  PANELS[b.dataset.p]().forEach(x=>{if(typeof x==="string")pnl.insertAdjacentHTML("beforeend",x);else pnl.appendChild(x)});});

/* 6. chip tier map */
const TCOL={"Tier 1":"var(--t1)","Tier 2":"var(--t2)","Tier 3":"var(--t3)"};
const NOWCOL=__NOWCOL__;
const tierBy=new Map(TIERS.map(r=>[String(r.iso_n3).padStart(3,"0"),r]));
let tmode="jan";
function drawTiers(){
  const m=document.getElementById("wmap");m.innerHTML="";m.setAttribute("viewBox",`0 0 ${WORLD.W} ${WORLD.H}`);
  WORLD.paths.forEach(p=>{const r=tierBy.get(String(p.id).padStart(3,"0"));
    const cat=tmode==="jan"?(r?.diffusion_tier_2025||"Tier 2"):(r?.current_status_2026||"__NOWDEFAULT__");
    const fill=tmode==="jan"?TCOL[cat]||"var(--t0)":NOWCOL[cat]||"var(--t0)";
    const e=el("path",{d:p.d,fill,class:p.name===M.name?"my":""},m);
    el("title",{},e).textContent=`${p.name}: ${cat}${tmode==="now"&&r?.current_status_note?" · "+r.current_status_note:""}`});
  const [mx,my]=WORLD.pts[M.name];el("line",{x1:mx,y1:my,x2:mx+40,y2:my+46,stroke:"var(--fg)"},m);
  T(m,mx+42,my+58,M.name,{fill:"var(--fg)",w:700,fs:13,mono:false});
  const cats=tmode==="jan"?TCOL:NOWCOL;
  document.getElementById("tlegend").innerHTML=Object.entries(cats).map(([k,c])=>`<span><i style="background:${c}"></i>${esc(k)}</span>`).join("");
  document.getElementById("tnote").innerHTML=tmode==="jan"?`__TNOTE_JAN__`:`__TNOTE_NOW__`;
}

/* 7. energy */
(function(){
  const svg=document.getElementById("mixchart"),FC={coal:"var(--coal)",gas:"var(--gas)",solar:"var(--solar)","hydro and other":"var(--hydro)","solar, hydro and other":"var(--hydro)"};

  const sc=document.getElementById("scenchart"),W2=760,H2=200,l=110,r=30,max=8;sc.setAttribute("viewBox",`0 0 ${W2} ${H2}`);

/* 3. timeline */
const TR={"Investment":"var(--us)",[M.policyTrack]:"var(--accent)","Geopolitics":"var(--cn)","Energy and water":"var(--other)"};
const KEY=new Set(M.keyDates);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=(d,p)=>{const [y,m,dd]=d.split("-");if(p==="year")return y;if(p==="month")return `${MON[+m-1]} ${y}`;return `${+dd} ${MON[+m-1]} ${y}`};
const on=new Set(Object.keys(TR));let keyOnly=true;
function drawTL(){
  const ch=document.getElementById("chips");ch.innerHTML="";
  Object.keys(TR).forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.style.borderLeftColor=TR[t];
    b.setAttribute("aria-pressed",on.has(t));b.onclick=()=>{on.has(t)?on.delete(t):on.add(t);drawTL()};ch.appendChild(b)});
  const tl=document.getElementById("tl");tl.innerHTML="";
  const list=EV.filter(e=>on.has(e.track)&&(!keyOnly||KEY.has(e.date)));
  list.forEach(e=>{
    const r=document.createElement("div");r.className="ev"+(KEY.has(e.date)?" key":"");r.style.setProperty("--c",TR[e.track]);
    const amt=e.amount_usd_m&&e.track==="Investment"?`<span class="amt">US$${(+e.amount_usd_m/1000).toFixed(1)}bn</span>`:"";
    r.innerHTML=`<div class="d">${fmt(e.date,e.date_precision)}</div><div><h3>${esc(e.title)}${amt}<span class="tag">${esc(e.track)}</span></h3><p>${esc(e.description)}</p>${keyOnly?`<p class="why">${esc(e.significance)}</p>`:""}<p class="src note"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.source_name)}</a></p></div>`;
    tl.appendChild(r)});
  document.getElementById("tlnote").textContent=`Showing ${list.length} of ${EV.length} verified events. Investment amounts are announced pledges, often multi-year and national, not money spent.`;
}
bindSeg("keyOnly","allEv",v=>keyOnly=v,drawTL);
drawTL();

/* 4. map */
const SC={"US":"var(--us)","China":"var(--cn)","Other":"var(--other)","Unknown":"var(--unk)","Mixed":"var(--unk)"};
const SL={"US":"US-linked","China":"China-linked","Other":M.otherLabel,"Unknown":"Unknown","Mixed":"Mixed"};
const sOn=new Set(["US","China","Other","Unknown","Mixed"]);let view=M.views[0].id;
const card=document.getElementById("siteCard");
function show(x){card.innerHTML=`<span class="eyebrow">${esc(x.town||x.state)}</span><h3>${esc(x.site_name)}</h3><dl>
 <dt>Operator</dt><dd>${esc(x.operator)}</dd><dt>Owners</dt><dd>${esc(x.owner_investors||"Not disclosed")}</dd>
 <dt>Anchor tenant</dt><dd>${esc(x.anchor_tenant||"Not disclosed")}</dd><dt>Stack</dt><dd>${esc(SL[x.stack]||x.stack)}</dd>
 <dt>Status</dt><dd>${esc(x.status)}</dd><dt>Capacity</dt><dd class="mono">${x.it_mw?esc(x.it_mw)+" MW ("+esc(x.mw_type)+")":"Not disclosed"}</dd>
 <dt>Confidence</dt><dd>${esc(x.confidence)}</dd></dl><p class="note"><a href="${esc(x.source_url)}" target="_blank" rel="noopener">Source</a>, placed at ${esc(x.latlon_precision||"town")} level.</p>`}
function drawMap(){
  const g=GEO[view],[x0,y0,x1,y1]=g.bbox,s=Math.min(g.W/(x1-x0),g.H/(y1-y0));
  const m=document.getElementById("mmap");m.innerHTML="";m.setAttribute("viewBox",`0 0 ${g.W} ${g.H}`);
  g.paths.forEach(p=>el("path",{d:p.d,class:"land"+(p.name===M.name?" my":"")},m));
  const P=(lon,lat)=>[(lon-x0)*s,(y1-lat)*s];
  const lab=(lon,lat,t)=>{const [x,y]=P(lon,lat);el("text",{x,y,"font-size":g.wide?12:13,fill:"var(--muted)","font-family":"JetBrains Mono,monospace","text-anchor":"middle"},m).textContent=t};
  (g.labels||[]).forEach(([lo,la,tx])=>lab(lo,la,tx));
  const pts=SI.filter(x=>x.lat&&x.lon&&sOn.has(x.stack)).filter(x=>+x.lon>=x0&&+x.lon<=x1&&+x.lat>=y0&&+x.lat<=y1);
  const groups={};pts.forEach(x=>{const k=x.lat+","+x.lon;(groups[k]=groups[k]||[]).push(x)});
  Object.values(groups).forEach(gr=>{gr.forEach((x,i)=>{
    let [cx,cy]=P(+x.lon,+x.lat);
    if(gr.length>1){const ring=GEO[view].wide?9:16,a=i/gr.length*2*Math.PI;cx+=Math.cos(a)*ring*(1+Math.floor(i/8)*.6);cy+=Math.sin(a)*ring*(1+Math.floor(i/8)*.6)}
    const r=(GEO[view].wide?3:4)+Math.sqrt(+x.it_mw||40)*(GEO[view].wide?.35:.55);
    const solid=x.status==="Operational",paused=x.status==="Paused/Cancelled";
    const c=el("circle",{cx,cy,r,fill:solid?SC[x.stack]:"var(--surface)","fill-opacity":solid?.85:.6,stroke:paused?"var(--muted)":SC[x.stack],"stroke-dasharray":x.status==="Announced"||paused?"3 2":"",class:"site",tabindex:0,role:"button","aria-label":x.site_name},m);
    el("title",{},c).textContent=`${x.site_name} · ${x.status}`;
    c.onclick=()=>show(x);c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show(x)}};
  })});
  const off=SI.filter(x=>x.lat&&x.lon&&sOn.has(x.stack)).length-pts.length;
  document.getElementById("mapnote").textContent=`${pts.length} ${pts.length===1?"campus":"campuses"} shown${off?`, ${off} outside this view`:""}. Sites in the same industrial park are fanned out around the park so each can be selected; positions are approximate.`;
}
const sc=document.getElementById("stackChips");
["US","China","Other","Unknown"].forEach(k=>{const b=document.createElement("button");b.className="chip";b.textContent=SL[k];b.style.borderLeftColor=SC[k];b.setAttribute("aria-pressed","true");
  b.onclick=()=>{const was=sOn.has(k);if(k==="Unknown"){["Unknown","Mixed"].forEach(z=>was?sOn.delete(z):sOn.add(z))}else{was?sOn.delete(k):sOn.add(k)}b.setAttribute("aria-pressed",!was);drawMap()};sc.appendChild(b)});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));view=b.dataset.v;drawMap()});
drawMap();show(SI.find(x=>x.site_name.startsWith("Bridge Data Centres MY06"))||SI[0]);

document.getElementById("undisc").textContent=`Location not disclosed: ${und.map(x=>x.site_name).join("; ")}.`;

[...EV.map(e=>[e.source_name,e.source_url]),...CO.map(c=>[c.capacity_source,c.capacity_source_url]),...SI.map(x=>[x.site_name,x.source_url])].forEach(([n,u])=>{if(u&&!urls.has(u))urls.set(u,n)});
